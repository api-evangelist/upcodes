aid: upcodes
name: UpCodes
description: UpCodes is a comprehensive compliance and product research platform for
  the construction industry, offering a searchable database of US construction and
  building codes consolidated by state and city for easier navigation. The platform
  includes libraries of codes, diagrams, and assemblies, project collaboration and
  bookmarking, code calculators with a BIM design data import tool, SAML single sign-on
  for enterprise teams, and an AI Copilot that answers code compliance questions,
  locates assemblies, and generates project-specific checklists. Plans span Essentials,
  Professional, and Enterprise tiers. UpCodes does not currently publish a public
  developer API.
